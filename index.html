<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pra você, Malu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@500;700&display=swap">
<style>
:root{--bg:#14131c;--card:#1f1d2b;--paper:#fff6e3;--ink:#2b2433;--flash:#fffbe8;--red:#c8372d;--gold:#f2b84b;--text:#f3eee3;--muted:#a9a4b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;min-height:100vh}
header{text-align:center;padding:48px 20px 24px;max-width:640px;margin:0 auto}
h1{font-weight:800;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;margin:0 0 14px}
header p{color:var(--muted);margin:0;font-size:1.05rem}
.count{margin-top:18px;color:var(--gold);font-weight:500}
main{max-width:760px;margin:0 auto;padding:16px 20px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.env{position:relative;border:0;cursor:pointer;text-align:left;background:var(--card);color:var(--text);font:inherit;padding:44px 18px 18px;min-height:150px;border-radius:6px;display:flex;align-items:flex-end;font-weight:500;font-size:1.05rem;overflow:hidden}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:60%;background:linear-gradient(to bottom right,transparent 49.5%,#2a2739 50%) ,linear-gradient(to bottom left,transparent 49.5%,#2a2739 50%);background-size:50.5% 100%,50.5% 100%;background-position:left top,right top;background-repeat:no-repeat}
.env::after{content:"";position:absolute;top:calc(60% - 14px);left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--red)}
.env span{position:relative;z-index:1}
.env:hover{outline:2px solid var(--gold)}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.env.read{opacity:.62}
.env.read::after{background:var(--gold)}
dialog{border:0;padding:0;background:transparent;max-width:min(560px,92vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,9,16,.82)}
.letter{background:var(--paper);border-radius:4px;padding:30px 26px 26px;max-height:82vh;overflow:auto}
.letter h2{margin:0 0 14px;font-size:1.05rem;font-weight:800;color:var(--red)}
.letter p{font-family:Caveat,cursive;font-size:1.65rem;line-height:1.3;margin:0 0 12px;font-weight:500}
.letter .sig{text-align:right;font-weight:700;margin-top:18px}
.close{margin-top:14px;background:var(--ink);color:var(--paper);border:0;padding:10px 22px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.close:focus-visible{outline:3px solid var(--gold)}
.letter img{width:100%;display:block;border-radius:4px;margin:0 0 16px;max-height:55vh;object-fit:cover}.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.gal img{margin:0;aspect-ratio:3/4;max-height:none}.env.sp{outline:2px solid var(--gold)}
#flash{position:fixed;inset:0;background:var(--flash);opacity:0;pointer-events:none;z-index:99}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.go{animation:none}}
</style>
</head>
<body>
<header>
<h1>Pra você, Malu</h1>
<p>Cada envelope é pra um momento. Abra um por vez, quando precisar.</p>
<div class="count" id="count"></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="letter" id="letter"></div></dialog>
<div id="flash"></div>

var L=[
{img:2,t:"Abra quando estiver com saudade",p:["Oi, meu amor.","Se você abriu este envelope, é porque a saudade apertou. Aqui também, sabia?","Eu penso naquela nossa primeira vez no cinema, a gente chegando cedo demais, rindo à toa, e já sentindo que ali começava algo grande.","A distância é só um pedaço do caminho. Fecha os olhos e lembra: eu estou com você, e logo estamos juntos de novo."]},
{img:5,t:"Abra quando tiver um dia ruim",p:["Princesa, vem cá.","Dia ruim não define você. Respira fundo, toma uma água e lembra que você já passou por coisa pior e saiu de cabeça erguida.","E se precisar rir: eu ainda quero a minha pata de volta no truco. Ninguém blefa melhor do que a gente.","Estou aqui pra o que precisar, até pra ouvir você desabafar por horas."]},
{img:6,t:"Abra quando não conseguir dormir",p:["Be, já está tarde, né?","Deixa o celular de lado um minutinho, relaxa os ombros e pensa em algo bom: uma call nossa, uma risada, um filme.","Eu queria estar aí te desejando boa noite pessoalmente. Como não dá, mando daqui um abraço bem apertado.","Dorme bem, amor. Amanhã eu estou aqui de novo."]},
{img:4,t:"Abra quando duvidar de si mesma",p:["Malu, escuta com atenção.","Você joga vôlei, beach tênis e o que mais aparecer, e ainda assim arruma tempo pra mim. Isso diz muito sobre a força e o coração que você tem.","Você é dedicada, corajosa e não desiste fácil. Eu vejo isso em cada treino, cada jogo, cada conversa nossa.","Confia em você do jeito que eu confio. Você é capaz de tudo."]},
{img:3,t:"Abra quando quiser sorrir",p:["Lembra do flash?","Aquele que acendeu sem querer no cinema, na hora errada, e virou a nossa piada pra sempre.","Toda vez que eu lembro, eu rio sozinho. E toda vez que penso em você, penso que você é a minha luz de verdade.","Você ilumina os meus dias, amor. Sem flash, sem cinema, do seu jeito."]},
{img:1,t:"Abra quando quiser ouvir a nossa música",p:["Dá o play em \"Seu Jeito de Olhar\", do MC Kevin.","Pra mim essa música é você: o seu olhar, o seu jeito de me tratar, o carinho de sempre.","Coloca no volume que quiser e lembra que alguém aqui pensa em você sempre que ela toca."]},
{img:0,t:"Abra quando precisar de um abraço",p:["Vem cá, Malu.","Esse envelope vale um abraço demorado, daqueles que a gente não quer soltar. Ele fica guardado comigo até a gente se ver.","E tem mais: desde agosto eu já sabia que era você. Hoje eu tenho certeza de que você é a mulher da minha vida.","Te amo, princesa."]},
{gal:1,t:"Abra quando quiser saber tudo o que eu gosto em você",p:["Bom, minha princesa, eu gosto de literalmente tudo em você e sempre vou amar TODOS os seus detalhes.","Quando você estiver insegura de si mesma, saiba que sempre estarei aqui para te apoiar. Eu beijaria cada uma das suas inseguranças, e você é perfeitinha do jeito que é.","Você é atenciosa, carinhosa e demonstra realmente gostar de mim, e isso é o que mais me encanta em você.","EU TE AMO ETERNAMENTE."]}
];
var read={},g=document.getElementById("grid"),dlg=document.getElementById("dlg"),lt=document.getElementById("letter"),fl=document.getElementById("flash");
function upd(){var n=Object.keys(read).length;document.getElementById("count").textContent=n===0?"":("Abertos: "+n+" de "+L.length)}
L.forEach(function(e,i){var b=document.createElement("button");b.className="env"+(e.gal?" sp":"");b.innerHTML="<span></span>";b.firstChild.textContent=e.t;b.onclick=function(){open_(i,b)};g.appendChild(b)});
function open_(i,b){
fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
var e=L[i];lt.innerHTML="";
var h=document.createElement("h2");h.textContent=e.t;lt.appendChild(h);
if(e.img!==undefined){var im=document.createElement("img");im.src=IMGS[e.img];im.alt="Foto de nós dois";lt.appendChild(im)}
if(e.gal){var gd=document.createElement("div");gd.className="gal";IMGS.forEach(function(s){var q=document.createElement("img");q.src=s;q.alt="Foto de nós dois";gd.appendChild(q)});lt.appendChild(gd)}
e.p.forEach(function(x){var p=document.createElement("p");p.textContent=x;lt.appendChild(p)});
var s=document.createElement("p");s.className="sig";s.textContent="Com todo o meu amor";lt.appendChild(s);
var c=document.createElement("button");c.className="close";c.textContent="Fechar carta";c.onclick=function(){dlg.close()};lt.appendChild(c);
dlg.showModal();read[i]=1;b.classList.add("read");upd();
}
dlg.addEventListener("click",function(ev){if(ev.target===dlg)dlg.close()});
</script>
